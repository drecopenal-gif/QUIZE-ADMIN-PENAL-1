<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
    .container{width:100%;max-width:480px}
    .card{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:32px 28px;box-shadow:0 25px 50px rgba(0,0,0,0.3)}
    .logo{text-align:center;margin-bottom:32px}
    .logo h1{font-size:26px;font-weight:700;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .logo p{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}
    .section{margin-bottom:28px}
    label{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);margin-bottom:8px}
    input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px 16px;color:#fff;font-size:15px;outline:none}
    input::placeholder{color:rgba(255,255,255,0.3)}
    input:focus{border-color:#818cf8;background:rgba(255,255,255,0.12)}
    .btn-row{display:flex;gap:10px;margin-top:14px}
    .btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
    .btn:active{transform:scale(0.97)}
    .btn-add{background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff}
    .btn-more{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);flex:0.5}
    .btn-generate{background:linear-gradient(135deg,#34d399,#10b981);color:#fff;width:100%;margin-top:14px}
    .btn-copy{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.15);width:100%;margin-top:12px}
    .website-list{display:none;margin-top:16px;max-height:220px;overflow-y:auto}
    .website-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;margin-bottom:8px;gap:10px}
    .website-item span{font-size:13px;color:rgba(255,255,255,0.75);word-break:break-all;flex:1}
    .btn-remove{background:rgba(239,68,68,0.2);color:#f87171;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
    .generated-box{display:none;margin-top:18px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);border-radius:16px;padding:16px}
    .generated-link{background:rgba(0,0,0,0.25);border-radius:10px;padding:12px;font-size:13px;word-break:break-all;color:#a7f3d0;line-height:1.5}
    .counter{display:inline-flex;align-items:center;justify-content:center;background:rgba(129,140,248,0.2);color:#a5b4fc;font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;margin-left:6px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>Admin Panel</h1>
        <p>Quiz Manager</p>
      </div>

      <div class="section">
        <label>Website URL <span class="counter" id="siteCounter">0</span></label>
        <input type="text" id="websiteUrl" placeholder="Paste Blogger post link">
        <div class="btn-row">
          <button class="btn btn-add" onclick="addWebsite()">Add</button>
          <button class="btn btn-more" id="moreBtn" onclick="toggleWebsites()">More</button>
        </div>
        <div class="website-list" id="websiteList"></div>
      </div>

      <div class="section">
        <label>Main Link</label>
        <input type="text" id="mainLink" placeholder="Paste your reward link">
        <button class="btn btn-generate" onclick="generateLink()">Generate Link</button>
        <div class="generated-box" id="generatedBox">
          <div class="generated-link" id="generatedLink"></div>
          <button class="btn btn-copy" onclick="copyLink()">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let websites = JSON.parse(localStorage.getItem('quizWebsites') || '[]');
    let listVisible = false;

    function updateCounter() {
      document.getElementById('siteCounter').innerText = websites.length;
    }

    function addWebsite() {
      const url = document.getElementById('websiteUrl').value.trim();
      if (!url) return alert('Enter URL');
      if (!url.startsWith('http')) return alert('Invalid URL');
      websites.push(url);
      localStorage.setItem('quizWebsites', JSON.stringify(websites));
      document.getElementById('websiteUrl').value = '';
      updateCounter();
      renderWebsites();
      if (!listVisible) toggleWebsites();
    }

    function removeWebsite(index) {
      websites.splice(index, 1);
      localStorage.setItem('quizWebsites', JSON.stringify(websites));
      updateCounter();
      renderWebsites();
    }

    function renderWebsites() {
      const list = document.getElementById('websiteList');
      list.innerHTML = '';
      if (websites.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:15px;color:rgba(255,255,255,0.4);font-size:13px;">No websites</div>`;
        return;
      }
      websites.forEach((url, i) => {
        list.innerHTML += `
          <div class="website-item">
            <span>${url}</span>
            <button class="btn-remove" onclick="removeWebsite(${i})">✕</button>
          </div>`;
      });
    }

    function toggleWebsites() {
      const list = document.getElementById('websiteList');
      const btn = document.getElementById('moreBtn');
      listVisible = !listVisible;
      list.style.display = listVisible ? 'block' : 'none';
      btn.innerText = listVisible ? 'Hide' : 'More';
      if (listVisible) renderWebsites();
    }

    function generateLink() {
      const mainLink = document.getElementById('mainLink').value.trim();
      if (!mainLink) return alert('Enter Main Link');
      if (websites.length === 0) return alert('Add at least 1 website');

      const data = { sites: websites, reward: mainLink };
      const encoded = btoa(JSON.stringify(data));
      const finalLink = window.location.href.split('?')[0] + '?data=' + encoded;

      document.getElementById('generatedLink').innerText = finalLink;
      document.getElementById('generatedBox').style.display = 'block';
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById('generatedLink').innerText)
        .then(() => alert('Copied!'));
    }

    window.onload = function () {
      updateCounter();
      const params = new URLSearchParams(window.location.search);
      const data = params.get('data');
      if (data) {
        try {
          const decoded = JSON.parse(atob(data));
          const randomSite = decoded.sites[Math.floor(Math.random() * decoded.sites.length)];
          const separator = randomSite.includes('?') ? '&' : '?';
          const finalUrl = randomSite + separator + 'reward=' + encodeURIComponent(decoded.reward);
          window.location.href = finalUrl;
        } catch (e) {
          document.body.innerHTML = `<div style="color:white;text-align:center;padding:100px 20px;"><h2>Invalid Link</h2></div>`;
        }
      }
    };
  </script>
</body>
</html>
